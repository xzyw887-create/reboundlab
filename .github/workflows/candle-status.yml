# Проверка загрузки свечей. Сайт и загрузчик не пересобирает.
# Раз в час: обычная загрузка — зелёная. Остановка, диск, ошибка или конец истории — красная,
# чтобы это было видно, даже если ноутбук закрыт.
name: Candle sync status

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '5.63.152.44' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
    steps:
      - name: Require SSH key secret
        run: |
          if [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Add repository secret VPS_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read loader status
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${VPS_USER}@${VPS_HOST}" 'bash -s' << 'REMOTE' | tee /tmp/candle-status.txt
          set -u
          name=$(docker ps -a --format "{{.Names}}" | grep market-sync | head -1)
          if [ -z "$name" ]; then
            echo "STATE=missing"
            exit 0
          fi
          status=$(docker inspect -f "{{.State.Status}}" "$name")
          echo "CONTAINER=$name"
          docker inspect -f "STATUS={{.State.Status}} STARTED={{.State.StartedAt}} RESTARTS={{.RestartCount}}" "$name"
          df -h / | awk "NR==2{print \"DISK_USED=\"\$3, \"DISK_FREE=\"\$4, \"DISK_PCT=\"\$5}"
          cid=$(docker ps -qf name=postgres | head -1)
          if [ -n "$cid" ]; then
            docker exec "$cid" psql -U reboundlab -d reboundlab -tA -c "SELECT 'PAIRS=' || COUNT(*) FROM market.trading_pairs tp JOIN market.exchanges e ON e.id = tp.exchange_id WHERE e.code = 'binance' AND tp.is_active;"
            docker exec "$cid" psql -U reboundlab -d reboundlab -tA -c "SELECT 'CHECKPOINTS_DONE=' || COUNT(*) FROM market.load_checkpoints WHERE timeframe = '1m' AND status = 'completed';"
            docker exec "$cid" psql -U reboundlab -d reboundlab -tA -c "SELECT 'ERRORS_6H=' || COUNT(*) FROM market.sync_logs WHERE level = 'ERROR' AND created_at > NOW() - INTERVAL '6 hours';"
          fi
          echo "---LOG---"
          log=$(docker logs --tail 40 "$name" 2>&1 || true)
          printf '%s\n' "$log"
          if [ "$status" != "running" ]; then
            echo "STATE=stopped"
          elif printf '%s\n' "$log" | grep -q "history loaded, live tail"; then
            echo "STATE=complete"
          elif printf '%s\n' "$log" | grep -q "DISK_LOW"; then
            echo "STATE=disk_low"
          elif printf '%s\n' "$log" | grep -q "\[ERROR\]"; then
            echo "STATE=error"
          else
            echo "STATE=loading"
          fi
          REMOTE
          state=$(sed -n 's/^STATE=//p' /tmp/candle-status.txt | tail -1)
          echo "Detected state: ${state:-unknown}"
          case "$state" in
            loading)
              echo "Ordinary load, no alert."
              ;;
            disk_low)
              echo "::error::Загрузка свечей встала: на диске мало места."
              exit 1
              ;;
            stopped)
              echo "::error::Загрузчик свечей остановлен."
              exit 1
              ;;
            error)
              echo "::error::Загрузка свечей остановилась с ошибкой."
              exit 1
              ;;
            complete)
              echo "::error::История за 3 года догружена, идёт только хвост новых минут."
              exit 1
              ;;
            missing)
              echo "::error::Контейнер загрузки свечей не найден."
              exit 1
              ;;
            *)
              echo "::error::Не удалось прочитать состояние загрузки свечей."
              exit 1
              ;;
          esac
