# Один VPS (Sprinthost / REG.RU / Timeweb): Postgres + BackTest Pro
# На сервере (из корня репозитория):
#   cp scripts/production.env.example .env   # заполнить
#   set -a && source .env && set +a && docker compose -f deploy/docker/docker-compose.prod.yml up -d --build
# Или: docker compose --env-file .env -f deploy/docker/docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    shm_size: "256mb"
    environment:
      POSTGRES_USER: reboundlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reboundlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reboundlab -d reboundlab"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://backtestpro.ru}
        NEXT_PUBLIC_EMAIL_PASSWORD_AUTH: ${NEXT_PUBLIC_EMAIL_PASSWORD_AUTH:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://reboundlab:${POSTGRES_PASSWORD}@postgres:5432/reboundlab
      PROJECT_ROOT: /app
      NODE_ENV: production
      PORT: "8080"
      # Явно из .env (после source / --env-file), иначе старый контейнер может жить без ЮKassa
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      YOOKASSA_SEND_RECEIPT: ${YOOKASSA_SEND_RECEIPT:-}
      BILLING_CHARGE_BASIC_RUB: ${BILLING_CHARGE_BASIC_RUB:-}
      BILLING_CHARGE_PRO_RUB: ${BILLING_CHARGE_PRO_RUB:-}
    ports:
      - "127.0.0.1:8080:8080"

  # Одноразовая загрузка свечей: docker compose -f ... --profile seed run --rm market-seed
  market-seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.market-seed
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://reboundlab:${POSTGRES_PASSWORD}@postgres:5432/reboundlab

volumes:
  pgdata:
